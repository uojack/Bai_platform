<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#165951"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><link rel="stylesheet" href="/style.css?v=1.0.1"><title>BaiTV · 电视快速恢复</title></head><body><header><a href="/" class="brand">BaiTV<span>百音 · 电视快速恢复</span></a><button id="refresh" class="quiet">刷新状态</button></header><main><section id="work" hidden><div class="intro"><div><h1>让画面继续播放。</h1><p>选择电视与指定画面，快速恢复播放。</p></div><p id="connection" class="connection">正在连接电视监护…</p></div><div class="toolbar"><div><button id="selectAll" class="quiet">选择四台</button><button id="selectHall" class="quiet">仅全景厅</button><button id="clear" class="text">清空</button></div><span id="updated">等待读取</span></div><section id="devices" aria-label="四台电视"></section><section class="action"><div><h2 id="selection">选择需要恢复的电视</h2><label class="check"><input id="auto" type="checkbox" checked>停播后自动恢复所选画面</label><p>仅恢复仍指向所选节目的停播；其他节目与暂停不接管。</p></div><button id="repair" disabled>恢复指定画面</button></section><p id="message" role="status" aria-live="polite"></p><button id="retry" class="quiet" hidden>按原编号重试提交</button><section id="operation" hidden aria-label="恢复结果"></section><details><summary>播放依据与连接说明</summary><p>“持续取流”表示电视正在读取对应直播分片，不等于已经核验电视上的实际像素。下方图片是节目源预览。</p><p>节目由本机生成，播放控制交给唯一的 BaiPlay 监护程序。网络离线、电视未开机或直播源过期时会保留明确原因。</p><p>同一局域网手机访问 <a href="http://baitv.local">http://baitv.local</a>。跨网络访问需网络侧另行配置。</p></details></section></main><footer>BaiTV 1.0.1 · 本机运行</footer><script src="/app.js?v=1.0.1" defer></script></body></html>
