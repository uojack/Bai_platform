</style></head><body><header><div><h1>AOS Pulse · LAGOOON</h1><small>V1.4 · 六页轮播 + 全景厅三屏</small></div><span class="badge">本机画面预览 · 电视状态需单独核验</span></header><nav id="tabs" aria-label="画面选择"></nav><iframe id="display" title="所选实时画面" src="/index.html?page=0"></iframe><p>视觉源：使用本机私有配置。百灵岛 D1，全景厅 D4。画面每 2 秒接入真实感知；声能单位为 dBFS，尚未校准为声压级。过期与未接入项明确显示状态。下方三屏保持固定角色，BaiPlayer 按设备身份固定左、中、右角色。</p><a id="full" href="/index.html?page=0" target="_blank">打开当前画面</a><h2>全景厅 · 连续空间</h2><p>左屏：空间状态　中屏：感知与理解　右屏：计算与响应。连续曲线随 D4 的实际声能变化。</p><div class="triptych"><iframe title="全景厅左屏" src="/index.html?mode=panorama1"></iframe><iframe title="全景厅中屏" src="/index.html?mode=panorama2"></iframe><iframe title="全景厅右屏" src="/index.html?mode=panorama3"></iframe></div><script>
var names=['空间总览','网络','认知声学','视觉算力','感知设备','空间状态','全景左屏','全景中屏','全景右屏'],tabs=document.querySelector('#tabs');names.forEach(function(name,i){var b=document.createElement('button');b.textContent=name;b.setAttribute('aria-selected',i===0?'true':'false');b.onclick=function(){var u='/index.html?'+(i<6?'page='+i:'mode=panorama'+(i-5));document.querySelector('#display').src=u;document.querySelector('#full').href=u;Array.from(tabs.children).forEach(function(x){x.setAttribute('aria-selected',x===b?'true':'false');});};tabs.appendChild(b);});
</script></body></html>
